server {
    listen 80;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "ok\n";
    }

    location = /Storm-lagbilde-2008.gif {
        return 301 /wp-content/uploads/2010/08/Storm-lagbilde-2008.gif;
    }

    location = /storm-staging-health.php {
        return 404;
    }

    location /Storm/ {
        proxy_pass http://legacy-static;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://wordpress;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
