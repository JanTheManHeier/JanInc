server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* ^/Storm/.*\.(?:php|inc)(?:_|$) {
        return 404;
    }

    location /Storm/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
