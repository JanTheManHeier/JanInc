<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Midlertidig utilgjengelig · JanInc</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, #0f2027 0%, #050a0e 70%);
      color: #e6f6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 18px;
      padding: 40px 32px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
      backdrop-filter: blur(6px);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      color: #00e5ff;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
      margin-bottom: 14px;
    }
    p { line-height: 1.6; opacity: 0.9; margin-bottom: 10px; }
    .sub { font-size: 0.85rem; opacity: 0.55; margin-top: 22px; }
    a { color: #00e5ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .divider { height: 1px; background: rgba(0,229,255,0.2); margin: 20px 0; }
    .en { opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🛠️</div>
    <h1>Midlertidig utilgjengelig</h1>
    <p>Denne appen er midlertidig slått av for vedlikehold og er snart tilbake.</p>
    <div class="divider"></div>
    <p class="en">This app is temporarily turned off for maintenance and will be back soon.</p>
    <p class="sub">JanInc · <a href="/">janinc.no</a></p>
  </main>
</body>
</html>
