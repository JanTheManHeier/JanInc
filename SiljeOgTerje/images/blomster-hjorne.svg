<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" aria-hidden="true">
  <defs>
    <radialGradient id="rosaRose" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FBE0E0"/>
      <stop offset="55%" stop-color="#F2B9BE"/>
      <stop offset="100%" stop-color="#DE949C"/>
    </radialGradient>
    <radialGradient id="lysRose" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FDEEEC"/>
      <stop offset="100%" stop-color="#F0C2C4"/>
    </radialGradient>
    <radialGradient id="lilla" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#E3D2EE"/>
      <stop offset="100%" stop-color="#B18FCB"/>
    </radialGradient>
    <linearGradient id="blad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B9C9AE"/>
      <stop offset="100%" stop-color="#8AA189"/>
    </linearGradient>
    <filter id="akvarell" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- Kålrose: lag på lag med kronblad -->
    <g id="rose">
      <circle r="46" fill="url(#rosaRose)" opacity="0.55"/>
      <g fill="url(#rosaRose)" stroke="#D98A93" stroke-width="0.8" stroke-opacity="0.5">
        <ellipse cx="0" cy="-30" rx="21" ry="17"/>
        <ellipse cx="26" cy="-15" rx="21" ry="17" transform="rotate(60)"/>
        <ellipse cx="26" cy="15" rx="21" ry="17" transform="rotate(120)"/>
        <ellipse cx="0" cy="30" rx="21" ry="17" transform="rotate(180)"/>
        <ellipse cx="-26" cy="15" rx="21" ry="17" transform="rotate(240)"/>
        <ellipse cx="-26" cy="-15" rx="21" ry="17" transform="rotate(300)"/>
      </g>
      <g fill="url(#lysRose)" stroke="#D98A93" stroke-width="0.8" stroke-opacity="0.45">
        <ellipse cx="0" cy="-16" rx="14" ry="12"/>
        <ellipse cx="15" cy="5" rx="14" ry="12"/>
        <ellipse cx="-15" cy="5" rx="14" ry="12"/>
        <ellipse cx="0" cy="14" rx="13" ry="11"/>
      </g>
      <path d="M -9 2 A 9 9 0 1 1 6 -6 A 13 13 0 1 0 -12 10" fill="none" stroke="#CE7F8A" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M -4 -1 A 5 5 0 1 1 3 3" fill="none" stroke="#CE7F8A" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Anemone / kosmos-blomst -->
    <g id="anemone">
      <g fill="url(#lilla)" stroke="#9E7BB8" stroke-width="0.7" stroke-opacity="0.5">
        <ellipse cx="0" cy="-17" rx="7" ry="15"/>
        <ellipse cx="0" cy="-17" rx="7" ry="15" transform="rotate(45)"/>
        <ellipse cx="0" cy="-17" rx="7" ry="15" transform="rotate(90)"/>
        <ellipse cx="0" cy="-17" rx="7" ry="15" transform="rotate(135)"/>
        <ellipse cx="0" cy="-17" rx="7" ry="15" transform="rotate(180)"/>
        <ellipse cx="0" cy="-17" rx="7" ry="15" transform="rotate(225)"/>
        <ellipse cx="0" cy="-17" rx="7" ry="15" transform="rotate(270)"/>
        <ellipse cx="0" cy="-17" rx="7" ry="15" transform="rotate(315)"/>
      </g>
      <circle r="6" fill="#7A5B44"/>
      <circle r="3" fill="#5E4433"/>
    </g>

    <!-- Lavendelaks -->
    <g id="lavendel">
      <path d="M0 0 C 2 -18, -2 -34, 0 -52" fill="none" stroke="#9AAE93" stroke-width="2" stroke-linecap="round"/>
      <g fill="#A98CC0" opacity="0.9">
        <ellipse cx="-4" cy="-16" rx="4" ry="5"/>
        <ellipse cx="4" cy="-22" rx="4" ry="5"/>
        <ellipse cx="-4" cy="-28" rx="4" ry="5"/>
        <ellipse cx="4" cy="-34" rx="3.6" ry="4.6"/>
        <ellipse cx="-3" cy="-40" rx="3.2" ry="4.2"/>
        <ellipse cx="2" cy="-46" rx="2.8" ry="3.6"/>
        <ellipse cx="0" cy="-51" rx="2.2" ry="3"/>
      </g>
    </g>

    <!-- Blad -->
    <g id="bladpar">
      <path d="M0 0 C 14 -10, 30 -8, 40 2 C 28 12, 12 12, 0 0 Z" fill="url(#blad)"/>
      <path d="M0 0 C 13 0, 28 1, 40 2" fill="none" stroke="#7C9179" stroke-width="1" stroke-opacity="0.7"/>
    </g>
  </defs>

  <!-- Myke akvarellflekker i bakgrunnen -->
  <g filter="url(#akvarell)" opacity="0.5">
    <circle cx="60" cy="55" r="52" fill="#F3C6CB"/>
    <circle cx="135" cy="40" r="34" fill="#E7D0EF"/>
    <circle cx="35" cy="130" r="38" fill="#EAD6F0"/>
    <circle cx="115" cy="115" r="26" fill="#F6DCD8"/>
  </g>

  <!-- Grønt / stilker -->
  <g opacity="0.85">
    <use href="#bladpar" transform="translate(96 96) rotate(35)"/>
    <use href="#bladpar" transform="translate(26 122) rotate(80) scale(0.85)"/>
    <use href="#bladpar" transform="translate(150 58) rotate(-15) scale(0.8)"/>
    <use href="#bladpar" transform="translate(120 20) rotate(20) scale(0.7)"/>
    <use href="#bladpar" transform="translate(30 30) rotate(200) scale(0.75)"/>
  </g>

  <!-- Lavendel -->
  <g opacity="0.95">
    <use href="#lavendel" transform="translate(150 130) rotate(28)"/>
    <use href="#lavendel" transform="translate(128 150) rotate(45) scale(0.9)"/>
    <use href="#lavendel" transform="translate(28 168) rotate(6) scale(0.95)"/>
    <use href="#lavendel" transform="translate(178 78) rotate(48) scale(0.8)"/>
  </g>

  <!-- Blomster -->
  <use href="#anemone" transform="translate(132 44) scale(0.95)"/>
  <use href="#anemone" transform="translate(40 128) scale(0.85)"/>
  <use href="#anemone" transform="translate(112 108) scale(0.7)"/>
  <use href="#rose" transform="translate(62 60)"/>
  <use href="#rose" transform="translate(128 96) scale(0.52)"/>

  <!-- Små knopper -->
  <g fill="#E9AEB6" opacity="0.9">
    <circle cx="160" cy="112" r="5"/>
    <circle cx="20" cy="150" r="4.5"/>
    <circle cx="150" cy="20" r="4"/>
    <circle cx="96" cy="140" r="4"/>
  </g>
</svg>
